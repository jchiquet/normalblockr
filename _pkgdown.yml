url: ~
template:
  bootstrap: 5

reference:
- title: 'User-facing functions'
  desc: >
    Main entry points for fitting a Normal-Block model and simulating data
  contents:
    - '`normal_block`'
    - '`NB_control`'
    - '`generate_normal_block_var_data`'
    - '`generate_normal_block_mean_data`'

- title: 'Model and data classes'
  desc: >
    R6 classes returned by normal_block(). NormalBlockData wraps the
    responses and design matrix; NormalBlockVar*Clusters (optionally
    ZI-prefixed) are single fitted models, known- or unknown-clustering;
    NormalBlockCollection* are collections of models explored over a
    range of q and/or sparsity penalties.
  contents:
    - '`NormalBlockData`'
    - '`NormalBlockVarKnownClusters`'
    - '`NormalBlockVarUnknownClusters`'
    - '`NormalBlockMeanKnownClusters`'
    - '`NormalBlockMeanUnknownClusters`'
    - '`ZINormalBlockVarKnownClusters`'
    - '`ZINormalBlockVarUnknownClusters`'
    - '`NormalBlockVarCollectionClusters`'
    - '`NormalBlockVarCollectionSparsity`'
    - '`NormalBlockVarCollectionClustersSparsity`'
    - '`NormalBlockMeanCollectionClusters`'
    - '`NormalBlockMeanCollectionSparsity`'

- title: 'Data sets'
  desc: ~
  contents:
    - '`brca_rppa`'
    - '`onema`'
    - '`university`'

- title: 'S3 methods'
  desc: >
    Standard extractors and methods for a fitted model (any NormalBlockBase
    subclass) and for a collection of models (any NormalBlockCollection subclass)
  contents:
    - '`coef.NormalBlockBase`'
    - '`fitted.NormalBlockBase`'
    - '`predict.NormalBlockVarBase`'
    - '`sigma.NormalBlockBase`'
    - '`print.NormalBlockBase`'
    - '`summary.NormalBlockBase`'
    - '`print.summary.NormalBlockBase`'
    - '`plot.NormalBlockBase`'
    - '`logLik.NormalBlockBase`'
    - '`BIC.NormalBlockBase`'
    - '`print.NormalBlockCollection`'
    - '`summary.NormalBlockCollection`'
    - '`print.summary.NormalBlockCollection`'
    - '`logLik.NormalBlockCollection`'
    - '`BIC.NormalBlockCollection`'

- title: 'Internal'
  desc: >
    Abstract base classes, low-level helpers and exploratory code kept for
    reference; not part of the user-facing API
  contents:
    - '`NormalBlockBase`'
    - '`NormalBlockVarBase`'
    - '`NormalBlockMeanBase`'
    - '`NormalBlockCollection`'
    - '`NormalBlockCollectionClusters`'
    - '`NormalBlockCollectionSparsity`'
    - '`SelectionNClusters`'
    - '`get_model`'
    - '`isNB`'
