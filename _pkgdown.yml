url: ~
template:
  bootstrap: 5

reference:
- title: 'User-facing functions'
  desc: >
    Main entry points for fitting a Normal-Block model and simulating data
  contents:
    - '`normal_block`'
    - '`NB_control`'
    - '`generate_normal_block_var_data`'

- title: 'Model and data classes'
  desc: >
    R6 classes returned by normal_block(). NormalBlockData wraps the
    responses and design matrix; NormalBlockVar*Clusters (optionally
    ZI-prefixed) are single fitted models, known- or unknown-clustering;
    NormalBlockVarCollection* are collections of models explored over a
    range of q and/or sparsity penalties.
  contents:
    - '`NormalBlockData`'
    - '`NormalBlockVarKnownClusters`'
    - '`NormalBlockVarUnknownClusters`'
    - '`ZINormalBlockVarKnownClusters`'
    - '`ZINormalBlockVarUnknownClusters`'
    - '`NormalBlockVarCollectionClusters`'
    - '`NormalBlockVarCollectionSparsity`'
    - '`NormalBlockVarCollectionClustersSparsity`'

- title: 'Data sets'
  desc: ~
  contents:
    - '`brca_rppa`'
    - '`onema`'
    - '`university`'

- title: 'S3 methods'
  desc: >
    Standard extractors and methods for a fitted model (any NormalBlockVarBase
    subclass) and for a collection of models (any NormalBlockVarCollection subclass)
  contents:
    - '`coef.NormalBlockVarBase`'
    - '`fitted.NormalBlockVarBase`'
    - '`predict.NormalBlockVarBase`'
    - '`sigma.NormalBlockVarBase`'
    - '`print.NormalBlockVarBase`'
    - '`summary.NormalBlockVarBase`'
    - '`print.summary.NormalBlockVarBase`'
    - '`plot.NormalBlockVarBase`'
    - '`logLik.NormalBlockVarBase`'
    - '`BIC.NormalBlockVarBase`'
    - '`print.NormalBlockVarCollection`'
    - '`summary.NormalBlockVarCollection`'
    - '`print.summary.NormalBlockVarCollection`'
    - '`logLik.NormalBlockVarCollection`'
    - '`BIC.NormalBlockVarCollection`'

- title: 'Internal'
  desc: >
    Abstract base classes, low-level helpers and exploratory code kept for
    reference; not part of the user-facing API
  contents:
    - '`NormalBlockVarBase`'
    - '`NormalBlockVarCollection`'
    - '`SelectionNClusters`'
    - '`get_model`'
    - '`isNB`'
